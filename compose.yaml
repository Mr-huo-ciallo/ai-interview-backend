name: ai-interview

x-backend-environment: &backend-environment
  APP_ENV: production
  AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET must be set}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
  DATABASE_URL: mysql+pymysql://${MYSQL_USER:-ai_interview}:${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}@database:3306/${MYSQL_DATABASE:-ai_interview}?charset=utf8mb4
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_BASE_URL: ${LLM_BASE_URL:-}
  LLM_MODEL: ${LLM_MODEL:-}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  TZ: ${TZ:-Asia/Shanghai}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-backend-service: &backend-service
  build:
    context: .
  image: ai-interview-backend:${APP_IMAGE_TAG:-local}
  environment: *backend-environment
  networks:
    - application
    - database
  logging: *default-logging

services:
  database:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai_interview}
      MYSQL_USER: ${MYSQL_USER:-ai_interview}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - database
    logging: *default-logging

  migrate:
    <<: *backend-service
    command: ["alembic", "upgrade", "head"]
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

  backend:
    <<: *backend-service
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ../ai-interview-platform
    image: ai-interview-platform:${APP_IMAGE_TAG:-local}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:80"
    networks:
      - application
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging

networks:
  application:
  database:
    internal: true

volumes:
  mysql-data:
